[project]
name = "eyetracker"
version = "0.1.0"
description = "@webmoti-employ/electron eyetracker"
requires-python = "==3.10.*"
dependencies = [
  "aiohttp>=3.12.15",
  "loguru>=0.7.3",
  "python-socketio>=5.13.0",
  "tobii-research>=2.1.0",
  "watchfiles>=1.1.1",
]

[dependency-groups]
dev = [
  "ruff>=0.12.4",
  "pyinstaller>=6.16.0",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "D103", # https://docs.astral.sh/ruff/rules/undocumented-public-function
  "D100", # https://docs.astral.sh/ruff/rules/undocumented-public-module
  "ERA001", # https://docs.astral.sh/ruff/rules/commented-out-code
]

[tool.ruff.format]
quote-style = "double"
