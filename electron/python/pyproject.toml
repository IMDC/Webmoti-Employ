[project]
name = "eyetracking-script"
version = "0.1.0"
description = "@webmoti-employ/electron eyetracking script"
requires-python = "==3.10.*"
dependencies = [
  "loguru>=0.7.3",
  "mediapipe>=0.10.21",
  "mss>=10.0.0",
  "numpy>=1.26.4",
  "opencv-python>=4.11.0.86",
  "tobii-research>=2.1.0",
]

[dependency-groups]
dev = [ "ruff>=0.12.4", ]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "D103", # https://docs.astral.sh/ruff/rules/undocumented-public-function
  "D100" # https://docs.astral.sh/ruff/rules/undocumented-public-module
]

[tool.ruff.format]
quote-style = "double"
