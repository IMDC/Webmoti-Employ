name: Electron Package

on:
  push:
    branches:
      - master
    # only run when electron package.json version changes
    paths:
      - electron/package.json
      - .github/workflows/package-electron.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: check
        uses: EndBug/version-check@5102328418c0130d66ca712d755c303e93368ce2
        with:
          diff-search: true
          file-name: electron/package.json

  package:
    if: needs.check-version.outputs.changed == 'true'
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          run_install: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: electron/python/.python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.10.9
          enable-cache: true

      - name: Create .env.electron
        run: echo "CLIENT_HOSTED_URL=${{ secrets.CLIENT_HOSTED_URL }}" > electron/.env.electron

      - name: Package for platform
        run: pnpm run dist:${{ matrix.platform }}

      - name: Set artifact path
        id: artifact
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            echo "path=electron/dist/*.AppImage" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" = "win" ]; then
            echo "path=electron/dist/*.exe" >> $GITHUB_OUTPUT
          else
            echo "path=electron/dist/*.dmg" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.platform }}-dist
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 1

  release:
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    needs: [check-version, package]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-dist'
          path: release/
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --oneline -- electron/)
          else
            LOG=$(git log --oneline -- electron/)
          fi
          {
            echo "body<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: release/**

      # since we don't need artifacts after the workflow, we delete them all.
      # this is because of the github artifact storage limit (recalculated every 6-12 hours)
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b
        with:
          name: '*-dist'
          failOnError: false
