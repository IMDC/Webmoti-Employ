name: Electron Package

on:
  push:
    branches:
      - master
    # only run when electron package.json version changes
    paths:
      - electron/package.json
      - .github/workflows/package-electron.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        uses: EndBug/version-check@5102328418c0130d66ca712d755c303e93368ce2
        with:
          diff-search: true
          file-name: electron/package.json

  package:
    if: needs.check-version.outputs.changed == 'true'
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version-file: electron/python/.python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.9
          enable-cache: true

      - name: Create .env.electron
        run: echo "CLIENT_HOSTED_URL=${{ secrets.CLIENT_HOSTED_URL }}" > electron/.env.electron

      - name: Package for platform
        run: pnpm run dist:${{ matrix.platform }}

      - name: Set artifact path
        id: artifact
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            echo "path=electron/dist/*.AppImage" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" = "win" ]; then
            echo "path=electron/dist/*.exe" >> $GITHUB_OUTPUT
          else
            echo "path=electron/dist/*.dmg" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-dist
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 1

  release:
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    needs: [check-version, package]
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-dist'
          path: release/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          files: release/**

      # since we don't need artifacts after the workflow, we delete them all.
      # this is because of the github artifact storage limit (recalculated every 6-12 hours)
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b
        with:
          name: '*-dist'
          failOnError: false
