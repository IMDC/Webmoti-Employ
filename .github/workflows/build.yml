name: Build and Deploy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Run lint
        run: pnpm lint

      # run build before checking server types
      - name: Run build
        run: pnpm run build

      - name: Check types
        run: pnpm typecheck

  # only deploy when pushing to main, not other branches (like dependabot)
  deploy-vercel:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-vercel.yml
    needs: [build]
    secrets: inherit

  deploy-cloudflare:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-cloudflare.yml
    needs: [build]
    secrets: inherit
