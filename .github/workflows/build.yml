name: Build and Deploy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # don't run postinstall scripts for security
      PNPM_CONFIG_IGNORE_SCRIPTS: true
      NPM_CONFIG_IGNORE_SCRIPTS: true
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # this copies the example .dev.vars so typegen populates CloudflareBindings properly
      - name: Mock env for server typegen
        working-directory: server
        run: |
          cp .dev.vars.example .dev.vars
          echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" >> .dev.vars

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types
        working-directory: server
        run: pnpm run cf-typegen

      - name: Run lint
        run: pnpm lint

      - name: Mock env for client build
        working-directory: client
        run: |
          cp .env.example .env

      # run build before checking server types
      - name: Run build
        run: pnpm run build

      - name: Check types
        run: pnpm typecheck

      - name: Install Playwright browser
        run: pnpm --filter @webmoti-employ/client exec playwright install chromium

      - name: Run Playwright tests
        run: pnpm --filter @webmoti-employ/client run test:e2e

      - name: Run vitest tests
        run: pnpm test

  # only deploy when pushing to main, not other branches (like dependabot)
  deploy-vercel:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-vercel.yml
    needs: [build]
    permissions:
      contents: read
      deployments: write
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-cloudflare:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-cloudflare.yml
    needs: [build]
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
