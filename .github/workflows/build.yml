name: Build and Deploy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # don't run postinstall scripts for security
      PNPM_CONFIG_IGNORE_SCRIPTS: true
      NPM_CONFIG_IGNORE_SCRIPTS: true

    steps:
      - uses: actions/checkout@v4

      # this copies the example .dev.vars so typegen populates CloudflareBindings properly
      - name: Mock env for server typegen
        working-directory: server
        run: |
          cp .dev.vars.example .dev.vars

      - uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Generate Cloudflare types
        working-directory: server
        run: pnpm run cf-typegen

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Run lint
        run: pnpm lint

      - name: Mock env for client build
        working-directory: client
        run: |
          cp .env.example .env

      # run build before checking server types
      - name: Run build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm --filter @webmoti-employ/client exec playwright install chromium

      - name: Run Playwright tests
        run: pnpm --filter @webmoti-employ/client run test:e2e

      - name: Run vitest tests
        run: pnpm test

      - name: Check types
        run: pnpm typecheck

  # only deploy when pushing to main, not other branches (like dependabot)
  deploy-vercel:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-vercel.yml
    needs: [build]
    secrets: inherit

  deploy-cloudflare:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-cloudflare.yml
    needs: [build]
    secrets: inherit
