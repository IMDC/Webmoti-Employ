rules:
  # GitHub environments are not available on org free plan for private repos
  secrets-outside-env:
    disable: true
  # setup-node cache + wrangler deploy: low risk since deploy only runs on master
  cache-poisoning:
    ignore:
      - deploy-cloudflare.yml
  # dorny/paths-filter needs git credentials, deploy checkouts already use persist-credentials: false
  artipacked:
    ignore:
      - deploy-cloudflare.yml
      - deploy-vercel.yml
