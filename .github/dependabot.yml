version: 2
updates:
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development
