version: 2
updates:
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
    groups:
      non-breaking:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      non-breaking:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      non-breaking:
        update-types:
          - patch
          - minor
