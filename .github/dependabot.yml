version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      non-breaking:
        update-types:
          - patch
          - minor
        exclude-patterns:
          - typescript
          - eslint
          - '@antfu/eslint-config'

  - package-ecosystem: uv
    directory: /electron/python/
    schedule:
      interval: weekly
    groups:
      non-breaking:
        update-types:
          - patch
          - minor
