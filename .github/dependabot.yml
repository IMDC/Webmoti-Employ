version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

    groups:
      minor:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@antfu/eslint-config'
          - '@eslint-react/eslint-plugin'
          - 'eslint-plugin*'
        update-types:
          - minor

      patch:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@antfu/eslint-config'
          - '@eslint-react/eslint-plugin'
          - 'eslint-plugin*'
        update-types:
          - patch

      eslint:
        applies-to: version-updates
        patterns:
          - '@antfu/eslint-config'
          - '@eslint-react/eslint-plugin'
          - 'eslint-plugin*'
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /electron/python/
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
