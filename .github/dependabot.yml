version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
        update-type: 'version-update:semver-major'
    cooldown:
      default-days: 30
      semver-major-days: 30

  - package-ecosystem: uv
    directory: /electron/python/
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
        update-type: 'version-update:semver-major'
    cooldown:
      default-days: 30
      semver-major-days: 30
