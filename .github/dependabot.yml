version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 2
      semver-minor-days: 14
      semver-major-days: 30
      include:
        - '*'
      exclude:
        - jose
        - better-auth
        - wrangler
    groups:
      non-breaking:
        update-types:
          - patch
          - minor
        exclude-patterns:
          - typescript
          - eslint
          - '@antfu/eslint-config'

  - package-ecosystem: uv
    directory: /electron/python/
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      semver-major-days: 45
      include:
        - '*'
    groups:
      non-breaking:
        update-types:
          - patch
          - minor
