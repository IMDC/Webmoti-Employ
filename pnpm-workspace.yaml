minimumReleaseAge: 4320

# shellEmulator makes Ctrl C not work on Windows
# eslint-disable-next-line pnpm/yaml-enforce-settings
shellEmulator: false

trustPolicy: no-downgrade

# semver < 7.5.1 has no provenance/trust evidence
trustPolicyExclude:
  - semver@5.7.2 || 6.3.1

packages:
  - client
  - server
  - shared
  - electron

overrides:
  # @cloudflare/vitest-pool-workers requires vitest 3.2
  '@vitest/runner': 3.2.4
  '@vitest/snapshot': 3.2.4
  # pg-connection-string v2.10.0 introduces a bug with vitest-pool-workers
  pg-connection-string: 2.9.1
  vitest: 3.2.4

catalog:
  '@zoom/videosdk': 2.3.15
  better-auth: 1.4.17
  zod: 4.3.6

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - workerd
minimumReleaseAgeExclude:
  # Renovate security update: wrangler@4.59.1
  - wrangler@4.59.1
