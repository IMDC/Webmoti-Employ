# this 3 day minimum is to avoid supply chain attacks
minimumReleaseAge: 4320

shellEmulator: true

trustPolicy: no-downgrade

packages:
  - client
  - server
  - shared
  - electron

overrides:
  # @cloudflare/vitest-pool-workers requires vitest 3.2
  '@vitest/runner': 3.2.4
  '@vitest/snapshot': 3.2.4
  # pg-connection-string v2.10.0 introduces a bug with vitest-pool-workers
  pg-connection-string: 2.9.1
  vitest: 3.2.4

catalog:
  better-auth: 1.4.17
  zod: 4.3.6

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - workerd
